<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgorBot v2 — Job Details</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 6px; font-size: 20px; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .meta { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
        .meta-row { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 6px; }
        .meta-label { color: #8b949e; min-width: 100px; font-size: 13px; }
        .meta-value { font-size: 13px; font-family: 'Cascadia Code', 'Fira Code', monospace; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-pending { background: #1f2937; color: #9ca3af; }
        .badge-provisioning { background: #1e3a5f; color: #60a5fa; }
        .badge-running { background: #064e3b; color: #34d399; }
        .badge-completed { background: #14532d; color: #4ade80; }
        .badge-failed { background: #7f1d1d; color: #f87171; }
        .badge-timedout { background: #78350f; color: #fbbf24; }

        .section-header { color: #8b949e; font-size: 13px; text-transform: uppercase; font-weight: 600; margin: 16px 0 8px; }

        #logContainer {
            background: #010409; border: 1px solid #21262d; border-radius: 6px;
            padding: 12px; max-height: 500px; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
        }
        .log-line { color: #8b949e; }
        .log-time { color: #484f58; margin-right: 8px; }

        #resultContainer {
            background: #161b22; border: 1px solid #21262d; border-radius: 6px;
            padding: 16px; font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
            display: none;
        }

        .error-box {
            background: #3b1117; border: 1px solid #7f1d1d; border-radius: 6px;
            padding: 12px; color: #f87171; font-size: 13px; display: none;
        }
    </style>
</head>
<body>
    <h1 id="jobTitle">Job Details</h1>

    <div class="meta" id="metaSection">
        <div>Loading...</div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="section-header">Logs</div>
    <div id="logContainer"></div>

    <div class="section-header" id="resultHeader" style="display:none">Results</div>
    <div id="resultContainer"></div>

    <script>
        const jobId = window.location.pathname.split('/').pop();
        const MAX_VISIBLE_LINES = 200;
        let eventSource = null;
        let logLineCount = 0;
        let totalSkipped = 0;

        async function loadJobStatus() {
            try {
                const res = await fetch(`/api/jobs/${jobId}/status`);
                const job = await res.json();
                renderMeta(job);

                if (job.status === 'Running' || job.status === 'Provisioning') {
                    startSSE();
                } else {
                    loadAllLogs();
                    if (job.status === 'Completed') showResultsAvailable();
                    if (job.status === 'Failed' || job.status === 'TimedOut') showError(job.errorMessage);
                }
            } catch (e) {
                console.error('Failed to load job:', e);
            }
        }

        function renderMeta(job) {
            document.getElementById('jobTitle').textContent = `Job ${job.id.substring(0, 8)}…`;
            document.title = `EgorBot — ${job.id.substring(0, 8)}…`;
            document.getElementById('metaSection').innerHTML = `
                <div class="meta-row">
                    <span class="meta-label">ID</span>
                    <span class="meta-value">${job.id}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Status</span>
                    <span class="badge badge-${job.status.toLowerCase()}">${job.status}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Platform</span>
                    <span class="meta-value">${job.platform}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Commits/PRs</span>
                    <span class="meta-value">${escapeHtml(job.commitsAndPrs)}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Created</span>
                    <span class="meta-value">${new Date(job.createdAt).toLocaleString()}</span>
                </div>
                ${job.completedAt ? `<div class="meta-row"><span class="meta-label">Completed</span><span class="meta-value">${new Date(job.completedAt).toLocaleString()}</span></div>` : ''}
                ${job.sourceUrl ? `<div class="meta-row"><span class="meta-label">Source</span><span class="meta-value"><a href="${escapeHtml(job.sourceUrl)}" target="_blank">${escapeHtml(job.sourceUrl)}</a></span></div>` : ''}
            `;
        }

        function startSSE() {
            if (eventSource) return;
            eventSource = new EventSource(`/api/jobs/${jobId}/logs/stream`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.done) {
                    eventSource.close();
                    eventSource = null;
                    setTimeout(() => loadJobStatus(), 500);
                    return;
                }
                appendLog(data);
                pruneOldLogs();
            };
            eventSource.onerror = () => {
                eventSource.close();
                eventSource = null;
                setTimeout(() => loadJobStatus(), 3000);
            };
        }

        async function loadAllLogs(loadFull) {
            try {
                const url = loadFull
                    ? `/api/jobs/${jobId}/logs`
                    : `/api/jobs/${jobId}/logs?tail=${MAX_VISIBLE_LINES}`;
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById('logContainer');
                container.innerHTML = '';
                logLineCount = 0;
                totalSkipped = 0;

                if (data.skipped && data.skipped > 0 && !loadFull) {
                    totalSkipped = data.skipped;
                    showSkippedBanner();
                }

                const frag = document.createDocumentFragment();
                for (const log of data.logs) {
                    frag.appendChild(createLogLine(log));
                    logLineCount++;
                }
                container.appendChild(frag);
                container.scrollTop = container.scrollHeight;
            } catch (e) { console.error(e); }
        }

        function createLogLine(log) {
            const line = document.createElement('div');
            line.className = 'log-line';
            const time = new Date(log.timestamp).toLocaleTimeString();
            line.innerHTML = `<span class="log-time">${time}</span>${escapeHtml(log.message)}`;
            return line;
        }

        function appendLog(log) {
            const container = document.getElementById('logContainer');
            container.appendChild(createLogLine(log));
            logLineCount++;
            container.scrollTop = container.scrollHeight;
        }

        function pruneOldLogs() {
            const container = document.getElementById('logContainer');
            while (logLineCount > MAX_VISIBLE_LINES) {
                // Remove the first .log-line (skip the banner if present)
                const first = container.querySelector('.log-line');
                if (!first) break;
                container.removeChild(first);
                logLineCount--;
                totalSkipped++;
            }
            showSkippedBanner();
        }

        function showSkippedBanner() {
            if (totalSkipped <= 0) return;
            const container = document.getElementById('logContainer');
            let banner = document.getElementById('skippedBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'skippedBanner';
                banner.style.cssText = 'color:#58a6ff;cursor:pointer;padding:4px 0;font-size:12px;border-bottom:1px solid #21262d;margin-bottom:4px;';
                banner.addEventListener('click', () => loadAllLogs(true));
                container.prepend(banner);
            }
            banner.textContent = `⬆ ${totalSkipped.toLocaleString()} older lines hidden — click to load all`;
        }

        function showResultsAvailable() {
            document.getElementById('resultHeader').style.display = '';
            const container = document.getElementById('resultContainer');
            container.style.display = '';
            container.innerHTML = 'Benchmark results are available. '
                + `<a href="/api/jobs/${jobId}/result" target="_blank">View raw results</a>`;
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.style.display = '';
            box.textContent = msg || 'Unknown error';
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        loadJobStatus();
    </script>
</body>
</html>
