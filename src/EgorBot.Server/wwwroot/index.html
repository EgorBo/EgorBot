<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgorBot v2 — Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2ea043; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        tr:hover { background: #161b22; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-pending { background: #1f2937; color: #9ca3af; }
        .badge-provisioning { background: #1e3a5f; color: #60a5fa; }
        .badge-running { background: #064e3b; color: #34d399; }
        .badge-completed { background: #14532d; color: #4ade80; }
        .badge-failed { background: #7f1d1d; color: #f87171; }
        .badge-timedout { background: #78350f; color: #fbbf24; }
        .badge-cancelled { background: #374151; color: #9ca3af; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 12px 16px; }
        .stat-card .label { color: #8b949e; font-size: 12px; }
        .stat-card .value { color: #c9d1d9; font-size: 24px; font-weight: bold; }
        .mono { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
        .empty { text-align: center; padding: 40px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 EgorBot v2</h1>
        <span id="autoRefresh" style="color: #8b949e; font-size: 12px;">Auto-refresh: 10s</span>
    </div>

    <div class="stats" id="stats"></div>

    <table>
        <thead>
            <tr>
                <th>Job ID</th>
                <th>Status</th>
                <th>Platform</th>
                <th>Commits / PRs</th>
                <th>Created</th>
                <th>Duration</th>
            </tr>
        </thead>
        <tbody id="jobsBody">
            <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadJobs() {
            try {
                const res = await fetch('/api/jobs?pageSize=50');
                const data = await res.json();
                renderStats(data);
                renderJobs(data.jobs);
            } catch (e) {
                console.error('Failed to load jobs:', e);
            }
        }

        function renderStats(data) {
            const counts = {};
            data.jobs.forEach(j => { counts[j.status] = (counts[j.status] || 0) + 1; });
            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="label">Total</div><div class="value">${data.total}</div></div>
                <div class="stat-card"><div class="label">Running</div><div class="value">${counts['Running'] || 0}</div></div>
                <div class="stat-card"><div class="label">Completed</div><div class="value">${counts['Completed'] || 0}</div></div>
                <div class="stat-card"><div class="label">Failed</div><div class="value">${(counts['Failed'] || 0) + (counts['TimedOut'] || 0)}</div></div>
            `;
        }

        function renderJobs(jobs) {
            const tbody = document.getElementById('jobsBody');
            if (!jobs.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No jobs yet.</td></tr>';
                return;
            }
            tbody.innerHTML = jobs.map(j => `
                <tr>
                    <td class="mono"><a href="/jobs/${j.id}">${j.id.substring(0, 8)}…</a></td>
                    <td><span class="badge badge-${j.status.toLowerCase()}">${j.status}</span></td>
                    <td class="mono">${j.platform}</td>
                    <td class="mono">${escapeHtml(j.commitsAndPrs)}</td>
                    <td>${formatTime(j.createdAt)}</td>
                    <td>${formatDuration(j.createdAt, j.completedAt)}</td>
                </tr>
            `).join('');
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function formatTime(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString();
        }

        function formatDuration(start, end) {
            if (!start) return '—';
            const s = new Date(start);
            const e = end ? new Date(end) : new Date();
            const ms = e - s;
            const mins = Math.floor(ms / 60000);
            const secs = Math.floor((ms % 60000) / 1000);
            return `${mins}m ${secs}s`;
        }

        loadJobs();
        setInterval(loadJobs, 10000);
    </script>
</body>
</html>
