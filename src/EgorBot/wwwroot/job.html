<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EgorBot — Job Detail</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 4px; }
        h2 { color: #c9d1d9; margin: 20px 0 10px; font-size: 1.1em; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .meta { color: #8b949e; margin-bottom: 20px; line-height: 1.8; }
        .meta strong { color: #c9d1d9; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: 600; }
        .badge-running { background: #1f6feb33; color: #58a6ff; }
        .badge-completed { background: #23863533; color: #3fb950; }
        .badge-failed { background: #da363433; color: #f85149; }
        .badge-pending { background: #30363d; color: #8b949e; }
        .badge-provisioning { background: #30363d; color: #8b949e; }
        .badge-timedout { background: #9e6a0333; color: #d29922; }
        .subjob { border: 1px solid #21262d; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #161b22; }
        .subjob-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .subjob-title { font-weight: 600; }
        .log-box { background: #010409; border: 1px solid #21262d; border-radius: 6px; padding: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.85em; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
        .metrics-box { display: flex; gap: 20px; margin: 8px 0; }
        .metric { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px 14px; }
        .metric-label { color: #8b949e; font-size: 0.8em; }
        .metric-value { font-size: 1.2em; font-weight: 600; }
        .back { margin-bottom: 16px; display: inline-block; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <a class="back" href="/">← Dashboard</a>
    <h1 id="title">Job</h1>
    <div id="meta" class="meta"></div>
    <div id="subjobs"></div>

    <script>
        const jobId = new URLSearchParams(location.search).get('id');
        if (!jobId) { document.body.innerHTML = '<p>No job ID specified.</p>'; }

        const logOffsets = {};
        const metricsOffsets = {};
        const logBuffers = {};

        function statusBadge(s) {
            const cls = { Running: 'running', Completed: 'completed', Failed: 'failed',
                          Pending: 'pending', Provisioning: 'provisioning', TimedOut: 'timedout', Deallocating: 'running' };
            return `<span class="badge badge-${cls[s] || 'pending'}">${s}</span>`;
        }

        function duration(start, end) {
            if (!start) return '—';
            const ms = (end ? new Date(end + 'Z') : new Date()) - new Date(start + 'Z');
            const m = Math.floor(ms / 60000);
            if (m < 1) return '<1m';
            if (m < 60) return m + 'm';
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
        }

        async function refreshJob() {
            try {
                const res = await fetch(`/api/jobs/${jobId}`);
                if (!res.ok) { document.getElementById('meta').textContent = 'Job not found.'; return; }
                const job = await res.json();

                document.getElementById('title').textContent = `Job ${job.id.substring(0, 8)}…`;
                document.title = `EgorBot — ${job.id.substring(0, 8)}`;
                document.getElementById('meta').innerHTML = `
                    <strong>Requester:</strong> ${job.requester} &nbsp;|&nbsp;
                    <strong>Repository:</strong> ${job.repository} &nbsp;|&nbsp;
                    <strong>PR:</strong> ${job.prNumber ? '#' + job.prNumber : '—'} &nbsp;|&nbsp;
                    <strong>Commits:</strong> ${job.commits || '—'}<br>
                    <strong>Status:</strong> ${statusBadge(job.status)} &nbsp;|&nbsp;
                    <strong>Duration:</strong> ${duration(job.createdAt, job.completedAt)} &nbsp;|&nbsp;
                    <strong>Perf:</strong> ${job.enablePerf ? 'Yes' : 'No'} &nbsp;|&nbsp;
                    <strong>Snippet:</strong> ${job.benchmarkSnippetUrl ? `<a href="${job.benchmarkSnippetUrl}" target="_blank">View</a>` : '—'}
                `;

                const container = document.getElementById('subjobs');

                for (const sub of job.subJobs) {
                    let el = document.getElementById('sub-' + sub.id);
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'sub-' + sub.id;
                        el.className = 'subjob';
                        el.innerHTML = `
                            <div class="subjob-header">
                                <span class="subjob-title">${sub.targetOs} / ${sub.targetArch} (${sub.hardwareProfile}) — ${sub.cloudProvider}</span>
                                <span id="status-${sub.id}"></span>
                            </div>
                            <div class="metrics-box" id="metrics-${sub.id}"></div>
                            ${sub.errorMessage ? `<p class="error">${sub.errorMessage}</p>` : ''}
                            <h2>Logs</h2>
                            <div class="log-box" id="logs-${sub.id}"></div>
                        `;
                        container.appendChild(el);
                        logOffsets[sub.id] = 0;
                        metricsOffsets[sub.id] = 0;
                        logBuffers[sub.id] = '';
                    }
                    document.getElementById('status-' + sub.id).innerHTML =
                        statusBadge(sub.status) + ' &nbsp; ' + duration(sub.createdAt, sub.completedAt);

                    if (sub.errorMessage) {
                        const errEl = el.querySelector('.error');
                        if (errEl) errEl.textContent = sub.errorMessage;
                    }
                }

                // Fetch logs and metrics for active sub-jobs
                for (const sub of job.subJobs) {
                    fetchLogs(sub.id);
                    fetchMetrics(sub.id);
                }
            } catch (e) { console.error('Failed to fetch job', e); }
        }

        async function fetchLogs(subId) {
            try {
                const res = await fetch(`/api/subjobs/${subId}/logs?from=${logOffsets[subId] || 0}`);
                const data = await res.json();
                if (data.logs.length > 0) {
                    logOffsets[subId] = data.nextFrom;
                    const box = document.getElementById('logs-' + subId);
                    for (const entry of data.logs) {
                        logBuffers[subId] = (logBuffers[subId] || '') + entry.line + '\n';
                    }
                    box.textContent = logBuffers[subId];
                    box.scrollTop = box.scrollHeight;
                }
            } catch (e) { /* ignore */ }
        }

        async function fetchMetrics(subId) {
            try {
                const res = await fetch(`/api/subjobs/${subId}/metrics?from=${Math.max(0, (metricsOffsets[subId] || 0) - 1)}`);
                const data = await res.json();
                if (data.metrics.length > 0) {
                    metricsOffsets[subId] = data.nextFrom;
                    const last = data.metrics[data.metrics.length - 1];
                    document.getElementById('metrics-' + subId).innerHTML = `
                        <div class="metric"><div class="metric-label">CPU</div><div class="metric-value">${last.cpuPercent.toFixed(1)}%</div></div>
                        <div class="metric"><div class="metric-label">Memory</div><div class="metric-value">${last.memoryMb.toFixed(0)} MB</div></div>
                    `;
                }
            } catch (e) { /* ignore */ }
        }

        if (jobId) { refreshJob(); setInterval(refreshJob, 3000); }
    </script>
</body>
</html>
